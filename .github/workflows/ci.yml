name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run static checks
        run: ruff check .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run canonical fixture evaluation without network
        run: >-
          python -m threat_to_detection.cli analyze evaluations/scenario.yaml
          --nvd-fixture tests/fixtures/nvd/cves.json
          --capec-fixture tests/fixtures/capec/attack_patterns.xml
          --attack-fixture tests/fixtures/attack/enterprise-attack.json
          --offline --output-dir evaluations/output
      - name: Regenerate multi-domain catalog evaluation without network
        run: >-
          python -m threat_to_detection.cli evaluate-scenarios
          --capec-fixture tests/fixtures/capec/attack_patterns.xml
          --attack-fixture tests/fixtures/attack/enterprise-attack.json
          --nvd-fixture tests/fixtures/nvd/cves.json
          --output /tmp/multidomain-results.json --report /tmp/multidomain-report.md
      - name: Generate evaluation visualizations without network
        run: >-
          python -m threat_to_detection.cli visualize-evaluations
          --evaluation-a evaluations/cve-evaluation.json
          --evaluation-b /tmp/multidomain-results.json
          --output-dir /tmp/evaluation-results
      - name: Run tests
        run: pytest -q
