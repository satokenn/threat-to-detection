[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-to-detection"
version = "0.1.0"
description = "A prototype for connecting vulnerability intelligence with detection planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
threat-to-detection = "threat_to_detection.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_to_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
